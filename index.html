<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rün𝟙c</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #080808;
      --panel:   #0e0e0e;
      --border:  #181818;
      --muted:   #3a3a3a;
      --dim:     #666;
      --text:    #d4d4d4;
      --bright:  #f0f0f0;
      --accent:  #00ffc3;
      --accent2: #7b61ff;
      --font:    'Source Code Pro', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.025;
      pointer-events: none;
      z-index: 9999;
    }

    .page {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100vh;
    }

    /* ─── SIDEBAR ─── */
    .sidebar {
      border-right: 1px solid var(--border);
      padding: 48px 32px;
      display: flex;
      flex-direction: column;
      gap: 48px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
    }

    .wordmark {
      font-size: 28px;
      font-weight: 700;
      color: var(--bright);
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .wordmark em {
      color: var(--accent);
      font-style: normal;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      list-style: none;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--dim);
      text-decoration: none;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.06em;
      padding: 6px 0;
      transition: color 0.15s;
    }

    .sidebar-nav a::before {
      content: '';
      display: block;
      width: 16px;
      height: 1px;
      background: var(--muted);
      transition: width 0.2s, background 0.15s;
    }

    .sidebar-nav a:hover { color: var(--accent); }
    .sidebar-nav a:hover::before { width: 28px; background: var(--accent); }

    .sidebar-bottom { margin-top: auto; }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--dim);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }

    /* ─── MAIN ─── */
    .main { display: flex; flex-direction: column; }

    /* ─── HERO ─── */
    .hero {
      padding: 80px 64px 72px;
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.5;
      pointer-events: none;
      mask-image: linear-gradient(to bottom, transparent, black 40%, black 60%, transparent);
    }

    .hero-tag {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
    }

    .hero-tag::before { content: '// '; color: var(--muted); }

    .hero h1 {
      font-size: clamp(36px, 5vw, 64px);
      font-weight: 700;
      color: var(--bright);
      letter-spacing: -0.04em;
      line-height: 1.05;
      position: relative;
      z-index: 1;
      margin-bottom: 8px;
    }

    .hero h1 .ghost {
      color: transparent;
      -webkit-text-stroke: 1px var(--muted);
    }

    .cursor-block {
      display: inline-block;
      width: 0.5em;
      height: 0.85em;
      background: var(--accent);
      vertical-align: text-bottom;
      margin-left: 6px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ─── SECTIONS ─── */
    .section {
      padding: 56px 64px;
      border-bottom: 1px solid var(--border);
    }

    .section-head {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 32px;
    }

    /* ─── THINGS ─── */
    .thing-list {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
    }

    .thing {
      display: grid;
      grid-template-columns: 100px 1fr auto;
      align-items: start;
      gap: 24px;
      padding: 22px 24px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
      text-decoration: none;
      color: inherit;
    }

    .thing:last-child { border-bottom: none; }
    .thing:hover { background: var(--panel); }

    .thing-type {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent2);
      padding-top: 3px;
    }

    .thing-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--bright);
      margin-bottom: 5px;
    }

    .thing-desc {
      font-size: 12px;
      color: var(--dim);
      font-weight: 300;
      line-height: 1.6;
    }

    .thing-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .tag {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 2px 7px;
    }

    .thing-arrow {
      color: var(--muted);
      font-size: 14px;
      padding-top: 2px;
      transition: color 0.15s, transform 0.15s;
    }

    .thing:hover .thing-arrow {
      color: var(--accent);
      transform: translateX(3px);
    }

    /* ─── LINKS ─── */
    .link-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .ext-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border: 1px solid var(--border);
      color: var(--dim);
      text-decoration: none;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.04em;
      transition: all 0.15s;
    }

    .ext-link:hover { border-color: var(--accent); color: var(--accent); }
    .ext-link .arrow { transition: transform 0.15s; }
    .ext-link:hover .arrow { transform: translate(2px, -2px); }

    /* ─── FOOTER ─── */
    .footer {
      padding: 24px 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer p { font-size: 11px; color: var(--muted); }

    /* ─── MOBILE ─── */
    @media (max-width: 700px) {
      .page { grid-template-columns: 1fr; }

      .sidebar {
        position: static;
        height: auto;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        padding: 20px 24px;
        gap: 0;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .sidebar-nav { flex-direction: row; gap: 20px; }
      .sidebar-nav a::before { display: none; }
      .sidebar-bottom { display: none; }

      .hero, .section { padding: 40px 24px; }
      .footer { padding: 20px 24px; }

      .thing {
        grid-template-columns: 1fr auto;
        gap: 12px;
      }
      .thing-type { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor-block, .status-dot { animation: none; }
      * { transition: none !important; }
    }
  </style>
</head>
<body>

<div class="page">

  <aside class="sidebar">
    <div class="wordmark">rün<em>𝟙</em>c</div>
    <ul class="sidebar-nav">
      <li><a href="#writeups">write-ups</a></li>
      <li><a href="#links">links</a></li>
    </ul>
    <div class="sidebar-bottom">
      <div class="status">
        <span class="status-dot"></span>
        online
      </div>
    </div>
  </aside>

  <main class="main">

    <section class="hero" id="top">
      <p class="hero-tag">welcome</p>
      <h1>
        rün<span style="color:var(--accent)">𝟙</span>c<span class="cursor-block"></span><br>
        <span class="ghost">————</span>

    </section>

    <section class="section" id="writeups">

            <div class="thing-tags">

      </div>
    </section>

    <section class="section" id="links">
      <p class="section-head">links</p>
      <div class="link-row">
        <a class="ext-link" href="https://github.com/srn0g" target="_blank" rel="noopener">

    </section>

    <footer class="footer">
      <p>rün𝟙c · 2026</p>
    </footer>

  </main>

</div>

</body>
</html>
